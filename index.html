<!doctype html>
<html lang="ja">
<head>

  <!-- Roobert is a licensed typeface; Inter is used as the closest open

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>

  <section class="kv" aria-label="Hero">
    <canvas id="kv-fluid" class="kv-fluid" aria-hidden="true"></canvas>

    <header class="kv-nav">

    <div class="scroll-badge" aria-hidden="true">
      <svg class="scroll-badge__ring" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

          <path id="scrollCircle" d="M 50,50 m -38,0 a 38,38 0 1,1 76,0 a 38,38 0 1,1 -76,0" />
        </defs>
        <text>
          <!-- textLength = circumference (2π·38) so the text fills the ring evenly -->
          <textPath href="#scrollCircle" startOffset="0" textLength="238" lengthAdjust="spacing">DOWNLOAD&#160;ON&#160;APP&#160;STORE&#160;&#160;·&#160;&#160;</textPath>
        </text>
      </svg>

  <script src="cursor.js"></script>
