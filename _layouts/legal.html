<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" class="legal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Relative paths (page.root) so the pages work both on the
       /peppa.games/ project URL and on a future custom domain. -->
  <link rel="stylesheet" href="{{ page.root }}style.css" />
  <link rel="stylesheet" href="{{ page.root }}legal.css" />
  <link rel="alternate" hreflang="{{ page.alt_lang }}" href="{{ page.alt_href }}" />
</head>
<body>

  <header class="kv-nav">
    <a href="{{ page.root }}" class="kv-nav__logo"><strong>Peppa</strong> for gamers</a>

    <button type="button" class="kv-nav__toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
      <span></span>
      <span></span>
    </button>
  </header>

  <nav id="site-menu" class="menu-panel" aria-label="Site menu">
    <ul class="menu-panel__list">
      <li><a class="menu-panel__link" href="{{ page.root }}">Home</a></li>
      <!-- 日本語版はページ内の言語切り替えから開く。メニューには英語版だけを載せる(2026-09-16) -->
      <li><a class="menu-panel__link" href="{{ page.root }}terms/"{% if page.menu_id contains 'terms' %} aria-current="page"{% endif %}>Terms of Service</a></li>
      <li><a class="menu-panel__link" href="{{ page.root }}privacy/"{% if page.menu_id contains 'privacy' %} aria-current="page"{% endif %}>Privacy Policy</a></li>
    </ul>
  </nav>

  <main class="legal-doc">
    <!-- 言語切り替え。今見ているほうを塗りつぶし、もう一方を白地で出す(2026-09-16) -->
    <nav class="legal-doc__lang" aria-label="Language">
      <div class="legal-doc__lang-group">
        {% if page.lang == 'ja' %}
        <a class="legal-doc__lang-option" href="{{ page.alt_href }}" hreflang="en" lang="en">English</a>
        <span class="legal-doc__lang-option" aria-current="true" lang="ja">日本語</span>
        {% else %}
        <span class="legal-doc__lang-option" aria-current="true" lang="en">English</span>
        <a class="legal-doc__lang-option" href="{{ page.alt_href }}" hreflang="ja" lang="ja">日本語</a>
        {% endif %}
      </div>
    </nav>
{{ content }}
  </main>

  <div class="cursor-dot" aria-hidden="true"></div>

  <script src="{{ page.root }}cursor.js"></script>
  <script src="{{ page.root }}script.js"></script>
</body>
</html>
